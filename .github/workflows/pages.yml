name: Demo

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - web/**
      - models/ich360/**
      - desktop/ui/js/fluxmap.js
      - desktop/ui/js/core.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the demo
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/rashevsky-wasm/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
          ./web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
