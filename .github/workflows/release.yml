name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli-and-desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the command line
        run: |
          cargo build --release -p rashevsky-cli
          tar -czf rashevsky-cli-linux-x86_64.tar.gz -C target/release rashevsky -C ../.. LICENSE README.md THIRD-PARTY-NOTICES.md
      - name: Build the desktop packages
        working-directory: desktop/src-tauri
        env:
          NO_STRIP: "true"
        run: npx --yes @tauri-apps/cli@2 build
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            rashevsky-cli-linux-x86_64.tar.gz
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/deb/*.deb

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --sdist
          manylinux: "2_28"
          before-script-linux: |
            (yum install -y cmake clang clang-devel || (apt-get update && apt-get install -y cmake clang libclang-dev))
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/rashevsky-wasm/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
          ./web/build.sh
          tar -czf rashevsky-labs-demo.tar.gz -C web/dist .
      - uses: softprops/action-gh-release@v3
        with:
          files: rashevsky-labs-demo.tar.gz
