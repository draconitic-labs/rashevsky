version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: monthly }
    groups:
      desktop: { patterns: ["*"] }
