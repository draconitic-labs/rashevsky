<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rashevsky demo: flux balance analysis of E. coli in your browser</title>
  <meta name="description" content="Delete reactions from the iCH360 model of E. coli and watch the fluxes reroute. Live flux balance analysis solved in the page by Rashevsky, an open-source metabolic modelling engine.">
  <link rel="canonical" href="https://draconitic-labs.github.io/rashevsky/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rashevsky demo: flux balance analysis of E. coli in your browser">
  <meta property="og:description" content="Delete reactions from a model of E. coli and watch the fluxes reroute, solved in the page.">
  <meta property="og:url" content="https://draconitic-labs.github.io/rashevsky/">
  <meta property="og:image" content="https://draconitic-labs.github.io/rashevsky/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="demo.js"></script>
</head>
<body>
  <canvas id="map" tabindex="0" aria-label="Flux map of the iCH360 model of E. coli. Select a reaction to delete it."></canvas>
  <header class="top">
    <h1>Rashevsky</h1>
    <small class="demo-mark">Demo</small>
    <nav class="links">
      <a href="NOTICE-iCH360.txt">Model terms</a>
      <a href="THIRD-PARTY-NOTICES.txt">Third-party notices</a>
      <a href="https://github.com/draconitic-labs/rashevsky">Source</a>
    </nav>
    <output id="growth" class="growth" aria-live="polite"></output>
    <span class="growth-label">Growth, 1/h</span>
    <span id="delta" class="delta"></span>
  </header>
  <div class="panel">
    <label>Glucose uptake <output id="glcOut">10</output>
      <input id="glc" type="range" min="0" max="30" step="0.5" value="10"></label>
    <label>Oxygen uptake <output id="o2Out">Unlimited</output>
      <input id="o2" type="range" min="0" max="60" step="1" value="60"></label>
  </div>
  <div id="tray" class="tray" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <noscript>This demo needs JavaScript and WebAssembly.</noscript>
</body>
</html>
