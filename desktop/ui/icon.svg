<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Rashevsky: the letter R drawn as central metabolism</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23282e"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="96" x2="0" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4d64e"/>
      <stop offset="0.52" stop-color="#a9d49a"/>
      <stop offset="1" stop-color="#5c84ff"/>
    </linearGradient>
    <linearGradient id="cycle" x1="170" y1="70" x2="420" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4d64e"/>
      <stop offset="0.55" stop-color="#7abed6"/>
      <stop offset="1" stop-color="#5c84ff"/>
    </linearGradient>
    <linearGradient id="leg" x1="250" y1="290" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c84ff"/>
      <stop offset="1" stop-color="#f4d64e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#plate)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#3a4149" stroke-width="1.5"/>
  <!-- A soft bloom under the strokes, as fluorescence on a dark field. -->
  <g filter="url(#glow)" opacity="0.5" fill="none" stroke-width="26" stroke-linecap="round">
    <path d="M168 104V416" stroke="url(#spine)"/>
    <path d="M168 104H272a92 92 0 0 1 0 184H168" stroke="url(#cycle)"/>
    <path d="M270 288L384 416" stroke="url(#leg)"/>
  </g>
  <g fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 104V416" stroke="url(#spine)"/>
    <path d="M168 104H272a92 92 0 0 1 0 184H168" stroke="url(#cycle)"/>
    <path d="M270 288L384 416" stroke="url(#leg)"/>
  </g>
  <!-- Metabolite beads: glycolysis down the stem, the citric acid cycle around the bowl. -->
  <g fill="#14171a" stroke="#fffdf2" stroke-width="5">
    <circle cx="168" cy="104" r="15"/>
    <circle cx="168" cy="184" r="10.5"/>
    <circle cx="168" cy="288" r="15"/>
    <circle cx="168" cy="352" r="10.5"/>
    <circle cx="168" cy="416" r="10.5"/>
    <circle cx="272" cy="104" r="10.5"/>
    <circle cx="337" cy="131" r="10.5"/>
    <circle cx="364" cy="196" r="10.5"/>
    <circle cx="337" cy="261" r="10.5"/>
    <circle cx="272" cy="288" r="15"/>
    <circle cx="384" cy="416" r="15"/>
  </g>
</svg>
